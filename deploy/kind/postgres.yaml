# Test database for the kind smoke test only (scripts/kind_smoke.sh, MKC-11.1).
# Not part of the chart and never used in production (production uses Supabase).
# Its own namespace, because the release namespace enforces Pod Security "restricted"
# and the Postgres image runs as root.
apiVersion: v1
kind: Namespace
metadata:
  name: mkc-kind-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mkc-db
  namespace: mkc-kind-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mkc-db
  template:
    metadata:
      labels:
        app: mkc-db
    spec:
      containers:
        - name: postgres
          # The same image as compose.yaml (Postgres 17 with pgvector).
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_USER
              value: mkc
            - name: POSTGRES_PASSWORD
              value: mkc
            - name: POSTGRES_DB
              value: mkc
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mkc", "-d", "mkc"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mkc-db
  namespace: mkc-kind-db
spec:
  selector:
    app: mkc-db
  ports:
    - port: 5432
