apiVersion: v1
kind: Service
metadata:
  name: {{ include "mkc.fullname" . }}-api
  labels:
    {{- include "mkc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "mkc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
