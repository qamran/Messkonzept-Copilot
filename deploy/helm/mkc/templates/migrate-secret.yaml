{{- /*
  Secret for the migration hook (MKC-11.1). Pre-install hooks run before the chart's own
  resources exist, so on a fresh install the Job can't read the chart's Secret. This hook
  copy is created first (negative weight) and deleted once the hooks have succeeded.
  Not rendered with existingSecret: that Secret is made outside the chart and already exists.
*/ -}}
{{- if and .Values.migrations.enabled (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mkc.fullname" . }}-migrate
  labels:
    {{- include "mkc.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
