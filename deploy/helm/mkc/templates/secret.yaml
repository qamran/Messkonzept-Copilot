{{- /* Built from .Values.secrets unless existingSecret names one made outside the chart. */ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mkc.secretName" . }}
  labels:
    {{- include "mkc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
