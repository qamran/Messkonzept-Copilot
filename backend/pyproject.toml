[project]
name = "mkc"
version = "0.1.0"
description = "Messkonzept-Copilot backend: API and harness worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
mkc-worker = "mkc.worker.main:run"
mkc-worker-health = "mkc.worker.health:main"
mkc-backup = "mkc.backup:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette deprecations (e.g. httpx for the TestClient) fail the tests instead of warning (MKC-6.1).
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
