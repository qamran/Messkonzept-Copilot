[project]
name = "mkc"
version = "0.1.0"
description = "Messkonzept-Copilot backend: API and harness worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-anthropic==1.7.13",
    "langchain-core==1.8.5",
    "langchain-google-genai==4.5.3",
    "langchain-openai==1.8.5",
    "langchain-openrouter==0.3.0",
    "langfuse==5.2.0",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer==0.29.3",
    "uvicorn>=0.32",
]

[project.scripts]
mkc-worker = "mkc.worker.main:run"
mkc-worker-health = "mkc.worker.health:main"
mkc-backup = "mkc.backup:main"
mkc-load-lbs = "mkc.reference.sync:main"
mkc = "mkc.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call paid provider APIs: run them on purpose with `-m live` (MKC-13.6).
addopts = "-ra -m 'not live'"
markers = ["live: calls a real provider API with a key; costs money; deselected by default"]
# Starlette deprecations (e.g. httpx for the TestClient) fail the tests instead of warning (MKC-6.1).
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
