# Local development and tests only (MKC-5). Not used in production.
# The credentials are dev-only placeholders for this container; it listens on 127.0.0.1 only.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mkc
      POSTGRES_PASSWORD: mkc
      POSTGRES_DB: mkc
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mkc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkc -d mkc"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mkc-db:
