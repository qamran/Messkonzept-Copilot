# Pre-commit hooks (MKC-6.2). Install once with `uvx pre-commit install`.
# CI runs the same checks (MKC-6.4), so a skipped local hook is still caught.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6  # keep in step with ruff in backend/uv.lock
    hooks:
      - id: ruff-check
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
