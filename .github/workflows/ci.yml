# CI (MKC-6.4). Runs on every PR to main and every push to main.
# Safety rules (checked by scripts/check_workflows.py):
# - no pull_request_target and no secrets, so fork PRs get nothing secret
# - read-only token; every action pinned to a commit SHA
# - no paths filters: every job always reports, because they are required checks on main
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          # Throwaway CI database; same placeholder credentials as compose.yaml.
          POSTGRES_USER: mkc
          POSTGRES_PASSWORD: mkc
          POSTGRES_DB: mkc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkc -d mkc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://mkc:mkc@127.0.0.1:5432/mkc
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.18"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # On Linux the POSIX-only SIGTERM worker test runs too; no test may be skipped here.
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan the full history, not only the tip
          persist-credentials: false
      - name: Install gitleaks (release binary, checksum pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Self-test, a fake key must be caught
        # The key is built at runtime, so no committed file contains it.
        run: |
          mkdir -p /tmp/leaktest
          suffix=$(head -c 512 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)
          printf 'token = "%s%s"\n' "ghp_" "$suffix" > /tmp/leaktest/fake.env
          set +e
          /tmp/gitleaks dir /tmp/leaktest --redact --no-banner
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::gitleaks did not flag the fake key (exit $code)"
            exit 1
          fi
          echo "gitleaks flagged the fake key (exit 1), as expected."
      - name: Scan the repository history
        run: /tmp/gitleaks git . --redact --no-banner --verbose

  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.18"
      - name: Export the locked backend dependencies
        run: uv export --frozen --all-groups --no-emit-project -o /tmp/requirements.txt
      - name: pip-audit against known vulnerabilities
        run: uvx pip-audit@2.10.1 --strict --require-hashes --disable-pip -r /tmp/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: npm audit (frontend; shipped packages at any level, build tools at high)
        working-directory: frontend
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high
      # The backend image is scanned in the image job (MKC-8.3).

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Markdown lint (all tracked Markdown)
        run: git ls-files -z '*.md' | xargs -0 npx --yes markdownlint-cli2@0.18.1
      - name: Check scripts
        run: |
          fail=0
          for script in scripts/check_*.py; do
            echo "== $script"
            python3 "$script" || fail=1
          done
          exit "$fail"

  # MKC-8.3: build the backend image, run the whole Compose stack, scan the image,
  # then build both platforms. Read-only token, no push (the push is MKC-8.4, main only).
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRYPE_VERSION: "0.121.2"
      GRYPE_SHA256: 9c8965ced9df657e5e851c14021bae838802f711edd7a48f9bc3c923a8d28f12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose smoke test (db, api, worker, frontend)
        env:
          MKC_COMMIT: ${{ github.sha }}
        run: bash scripts/compose_smoke.sh
      - name: Install Grype (release binary, checksum pinned)
        run: |
          curl -sSfL -o /tmp/grype.tgz             "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  /tmp/grype.tgz" | sha256sum -c -
          tar -xzf /tmp/grype.tgz -C /tmp grype
          /tmp/grype version
      - name: Scan the backend image (fail on high or critical with a fix)
        run: /tmp/grype mkc-backend:smoke --only-fixed --fail-on high
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64,linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          build-args: MKC_COMMIT=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # MKC-8.4: push the backend image to GHCR. Only on a push to main in the home repo
  # (Actions also run on the Turing mirror, which must not push). The only job with a
  # write permission (packages: write); it logs in with github.token, not a stored secret.
  publish:
    needs: [backend, frontend, gitleaks, dependency-scan, docs, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'qamran/Messkonzept-Copilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/qamran/messkonzept-copilot-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push linux/amd64,linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          build-args: MKC_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/qamran/Messkonzept-Copilot
          cache-from: type=gha,scope=backend
      - name: Show both tags and their platforms (evidence for MKC-8)
        run: |
          for tag in "${GITHUB_SHA}" main; do
            echo "== ${IMAGE}:${tag}"
            docker buildx imagetools inspect "${IMAGE}:${tag}"
          done
